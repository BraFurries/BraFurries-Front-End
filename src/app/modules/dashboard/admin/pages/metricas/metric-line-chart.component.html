<svg class="block h-48 w-full" viewBox="0 0 640 200" preserveAspectRatio="none"
     role="group" [attr.aria-label]="label"
     (mousemove)="onMouseMove($event)" (mouseleave)="activePoint = null">
  <g *ngFor="let tick of chart.ticks" class="metric-grid-tick">
    <line x1="78" [attr.y1]="tick.y" x2="620" [attr.y2]="tick.y"
          stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="69" [attr.y]="tick.y + 4" text-anchor="end"
          font-size="11" fill="#6b7280">{{ tick.value | number:'1.0-0' }}</text>
  </g>
  <polyline *ngFor="let segment of chart.segments"
    [attr.points]="segment.points" fill="none" [attr.stroke]="lineColor"
    stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle *ngFor="let point of chart.markers"
    [attr.cx]="point.x" [attr.cy]="point.y" r="4" [attr.fill]="lineColor"
    stroke="white" stroke-width="1.5"
    tabindex="0" role="img"
    [attr.aria-label]="dateLabel(point.date) + ' UTC: ' + point.value + ' ' + unit"
    (focus)="activePoint = point" (blur)="activePoint = null"/>
  <g *ngIf="activePoint as point" class="metric-tooltip" aria-hidden="true" pointer-events="none">
    <line class="metric-crosshair" [attr.x1]="point.x" y1="22"
          [attr.x2]="point.x" y2="170" stroke="#9ca3af"
          stroke-width="1" stroke-dasharray="4 4"/>
    <line class="metric-crosshair" x1="78" [attr.y1]="point.y"
          x2="620" [attr.y2]="point.y" stroke="#9ca3af"
          stroke-width="1" stroke-dasharray="4 4"/>
    <circle [attr.cx]="point.x" [attr.cy]="point.y"
            r="6" fill="white" [attr.stroke]="lineColor" stroke-width="2"/>
    <rect [attr.x]="tooltipX(point)" [attr.y]="tooltipY(point)"
          width="178" height="50" rx="8" fill="#111827"/>
    <text [attr.x]="tooltipX(point) + 12" [attr.y]="tooltipY(point) + 19"
          font-size="12" fill="#d1d5db">{{ dateLabel(point.date) }} (UTC)</text>
    <text [attr.x]="tooltipX(point) + 12" [attr.y]="tooltipY(point) + 38"
          font-size="14" font-weight="bold" fill="white">
      {{ point.value | number:'1.0-0' }} {{ unit }}
    </text>
  </g>
</svg>
