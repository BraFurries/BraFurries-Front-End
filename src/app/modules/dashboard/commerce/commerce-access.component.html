<section class="mx-auto max-w-4xl p-5 md:p-10">
  <p *ngIf="loading" role="status" class="rounded-2xl bg-white p-6 text-gray-600">
    Abrindo Gestão Comercial...
  </p>
  <p *ngIf="errorMessage" role="alert"
     class="rounded-2xl border border-red-200 bg-red-50 p-6 text-sm text-red-700">{{ errorMessage }}</p>
</section>
