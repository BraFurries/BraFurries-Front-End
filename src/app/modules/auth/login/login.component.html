<div class="bg-gray-50 min-h-screen flex items-center justify-center relative overflow-hidden font-archivo py-6 transition-all duration-700 ease-in-out"
    [ngClass]="{'blur-md scale-95 opacity-50': isLoggingIn}">

    <!-- Error Notification Toast -->
    <div class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] transition-all duration-500 ease-out flex items-center gap-3 bg-red-500/90 backdrop-blur-md text-white px-6 py-3 rounded-2xl shadow-[0_8px_30px_rgb(239,68,68,0.3)] border border-red-400/50"
        [ngClass]="errorMessage ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 -translate-y-10 scale-95 pointer-events-none'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="font-archivo font-bold text-sm">{{ errorMessage }}</span>
        <button type="button" (click)="errorMessage = ''"
            class="ml-2 hover:bg-white/20 rounded-full p-1.5 transition-colors shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <div class="fixed inset-0 bg-pattern z-0 pointer-events-none"></div>
    <div class="blob bg-braPurple top-[-10%] left-[-10%]"></div>
    <div class="blob bg-braCyan bottom-[-10%] right-[-10%]"></div>
    <div class="blob bg-braYellow bottom-[20%] left-[10%] opacity-10"></div>

    <div class="relative z-10 w-full max-w-md px-4">
        <div
            class="w-full bg-white/80 backdrop-blur-xl rounded-[3rem] shadow-2xl p-8 md:p-12 relative z-10 border border-white/50">

            <div class="flex flex-col items-center text-center mb-10">
                <a href="/" class="w-24 h-24 flex justify-center items-center group mb-4">
                    <img src="../../../../assets/images/logo-Brafurries/brafurries-sticker-low.avif"
                        alt="Logo BraFurries"
                        class="w-full h-full object-contain transition-all duration-500 ease-out group-hover:drop-shadow-[0_0_10px_#45bced90] group-hover:scale-105">
                </a>
                <h2 class="text-3xl font-amaranth font-bold text-braDark italic mb-2">Bem-vindo(a) de volta!</h2>
                <p class="text-gray-500 text-sm font-semibold uppercase tracking-widest">Acesse sua conta BraFurries</p>
            </div>

            <form class="space-y-5" id="loginForm" [formGroup]="loginForm" (ngSubmit)="login()">
                <div>
                    <div class="flex justify-between items-end mt-2 mb-2 px-4">
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest"
                            for="email">Email</label>
                        <div class="flex items-center gap-2 group">
                            <input type="checkbox" id="remember" formControlName="rememberMe"
                                class="w-4 h-4 bg-white border border-gray-300 rounded focus:ring-2 focus:ring-braPurple focus:outline-none accent-braPurple cursor-pointer transition-all">
                            <label for="remember"
                                class="text-xs font-bold text-braPurple cursor-pointer select-none group-hover:text-braDark transition-colors">
                                Lembrar de mim
                            </label>
                        </div>
                    </div>
                    <app-input-wrapper class="input block w-full" formControlName="email" placeholder="seu@email.com"
                        [required]="true"></app-input-wrapper>
                </div>

                <div class="relative mt-2">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-4"
                        for="password">Senha</label>

                    <app-input-wrapper class="input block w-full" formControlName="password" type="password"
                        placeholder="Digite sua senha" [required]="true"></app-input-wrapper>

                    <a routerLink="/forgot-password"
                        class="absolute top-0 right-4 text-xs font-bold text-braPurple hover:underline focus:outline-none focus:ring-2 focus:ring-braPurple rounded">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" [disabled]="isSubmitting"
                    class="w-full text-white font-amaranth font-bold text-lg py-4 rounded-2xl shadow-xl transition-all duration-300 mt-4 flex items-center justify-center gap-3 relative overflow-hidden"
                    [ngClass]="isSubmitting ? 'bg-braPurple opacity-80 cursor-wait scale-[0.98]' : 'bg-braDark hover:bg-braPurple transform hover:scale-[1.02] active:scale-95'">

                    <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>

                    <span>{{ isSubmitting ? 'Autenticando...' : 'Entrar na Alcateia' }}</span>
                </button>
            </form>

            <div class="relative flex items-center py-8">
                <div class="flex-grow border-t border-gray-100"></div>
                <span class="flex-shrink-0 mx-4 text-gray-300 text-[10px] font-bold uppercase tracking-widest">Ou entre
                    com</span>
                <div class="flex-grow border-t border-gray-100"></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button
                    class="flex items-center justify-center gap-3 bg-[#5865F2] text-white py-3 rounded-2xl transition-all shadow-md group"
                    (click)="socialLogin('discord')">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" />
                    </svg>
                    <span class="text-sm font-bold">Discord</span>
                </button>

                <button
                    class="flex items-center justify-center gap-3 bg-white border border-gray-200 text-gray-600 py-3 rounded-2xl transition-all shadow-md group"
                    (click)="socialLogin('google')">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span class="text-sm font-bold">Google</span>
                </button>
            </div>

            <p class="text-center mt-10 text-xs font-bold text-gray-400">
                Ainda não é um membro?
                <a routerLink="/register" class="text-braMagenta hover:underline">Crie sua conta agora</a>
            </p>
        </div>

        <div class="mt-8 flex justify-center gap-6 text-[10px] font-bold uppercase tracking-widest text-gray-400 pb-5">
            <a routerLink="/tos" class="hover:text-braDark transition">Termos de Uso</a>
            <a routerLink="/privacidade" class="hover:text-braDark transition">Privacidade</a>
        </div>
    </div>

</div>

<!-- Overlay de Login -->
<div *ngIf="isLoggingIn"
    class="login-overlay fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-braDark/90 backdrop-blur-sm">
    <div class="relative">
        <div class="absolute inset-0 bg-braCyan/20 blur-xl rounded-full animate-pulse"></div>
        <img src="../../../../assets/images/logo-Brafurries/brafurries-sticker-low.avif" alt="Logo"
            class="relative w-36 h-36 login-logo mb-6 drop-shadow-[0_0_15px_#45bced90]">
    </div>
    <h2 class="text-white font-amaranth text-4xl font-bold login-text tracking-wide">Acesso Liberado!</h2>
    <p class="text-braCyan font-archivo mt-3 login-subtext text-lg">Preparando seu painel...</p>
</div>
