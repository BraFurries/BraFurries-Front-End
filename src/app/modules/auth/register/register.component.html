<div class="bg-gray-50 min-h-screen flex items-center justify-center relative overflow-hidden font-archivo py-6">

    <div class="fixed inset-0 bg-pattern z-0 pointer-events-none"></div>
    <div class="blob bg-braPurple top-[-10%] left-[-10%]"></div>
    <div class="blob bg-braCyan bottom-[-10%] right-[-10%]"></div>
    <div class="blob bg-braYellow top-[20%] right-[10%] opacity-10"></div>

    <div class="relative z-10 w-full max-w-lg px-4">
        <div
            class="w-full bg-white/80 backdrop-blur-xl rounded-[3rem] shadow-2xl p-8 md:p-12 relative z-10 border border-white/50">
            <div class="flex flex-col items-center text-center mb-8">
                <a href="/" class="w-20 h-20 flex justify-center items-center group mb-4">
                    <img src="../../../../assets/images/logo-Brafurries/brafurries-sticker-low.avif"
                        alt="Logo BraFurries"
                        class="w-full h-full object-contain transition-all duration-500 ease-out group-hover:drop-shadow-[0_0_10px_#45bced90] group-hover:scale-105">
                </a>
                <h2 class="text-3xl font-amaranth font-bold text-braDark italic mb-2">Junte-se à Alcateia</h2>
                <p class="text-gray-500 text-sm font-semibold uppercase tracking-widest">Crie sua conta global
                    BraFurries</p>
            </div>

            <form class="space-y-4" id="registerForm" [formGroup]="registerForm" (enterkeyhint)="register()">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-4">Como
                        quer ser chamado?</label>
                    <app-input-wrapper formControlName="displayName" placeholder="Seu nome ou apelido" [required]="true"
                        class="input"></app-input-wrapper>
                </div>

                <div>
                    <label
                        class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-4">E-mail</label>
                    <app-input-wrapper formControlName="email" placeholder="seu@email.com" [required]="true"
                        class="input"></app-input-wrapper>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-4">Senha</label>
                        <app-input-wrapper formControlName="password" type="password" placeholder="Digite sua senha"
                            [required]="true" class="input"></app-input-wrapper>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 ml-4">Confirmar
                            senha</label>
                        <app-input-wrapper formControlName="passwordConfirmation" type="password"
                            placeholder="Repita sua senha" [required]="true" class="input"></app-input-wrapper>
                    </div>
                </div>

                <p *ngIf="errorMessage" class="px-4 text-sm font-semibold text-red-500">
                    {{ errorMessage }}
                </p>

                <div class="pt-2 px-4">
                    <div class="flex items-start gap-3 group">
                        <input type="checkbox" id="terms" formControlName="termsAgreement"
                            class="mt-1 w-4 h-4 bg-white border border-gray-300 rounded focus:ring-2 focus:ring-braMagenta focus:outline-none accent-braMagenta cursor-pointer transition-all">

                        <label for="terms"
                            class="text-[11px] font-bold text-gray-500 cursor-pointer select-none leading-tight">
                            Eu li e concordo com os <a href="/tos" target="_blank"
                                class="text-braMagenta hover:underline">Termos de Uso</a> e a <a href="/privacidade"
                                target="_blank" class="text-braMagenta hover:underline">Politica de Privacidade</a> da
                            comunidade.
                        </label>
                    </div>
                </div>

                <button type="button" (click)="register()" [disabled]="isSubmitting"
                    class="w-full bg-braDark text-white font-amaranth font-bold text-lg py-4 rounded-2xl shadow-xl hover:bg-braMagenta transform hover:scale-[1.02] mt-4 active:scale-95 transition-all duration-300 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:scale-100 disabled:hover:bg-braDark">
                    {{ isSubmitting ? 'Criando conta...' : 'Criar minha conta' }}
                </button>
            </form>

            <div class="relative flex items-center py-6">
                <div class="flex-grow border-t border-gray-100"></div>
                <span class="flex-shrink-0 mx-4 text-gray-300 text-[10px] font-bold uppercase tracking-widest">Ou
                    registre-se com</span>
                <div class="flex-grow border-t border-gray-100"></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button (click)="socialLogin('discord')"
                    class="flex items-center justify-center gap-3 bg-[#5865F2] text-white py-3 rounded-2xl transition-all shadow-md">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path
                            d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" />
                    </svg>
                    <span class="text-sm font-bold">Discord</span>
                </button>

                <button (click)="socialLogin('google')"
                    class="flex items-center justify-center gap-3 bg-white border border-gray-200 text-gray-600 py-3 rounded-2xl transition-all shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span class="text-sm font-bold">Google</span>
                </button>
            </div>

            <p class="text-center mt-8 text-xs font-bold text-gray-400">
                Ja faz parte da alcateia?
                <a href="/login" class="text-braCyan hover:underline">Entre aqui</a>
            </p>
        </div>
    </div>

</div>
