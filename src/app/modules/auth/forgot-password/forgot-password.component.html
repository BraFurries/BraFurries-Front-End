<div class="bg-gray-50 min-h-screen flex items-center justify-center relative overflow-hidden font-archivo py-6 transition-all duration-700 ease-in-out">
    <div class="fixed inset-0 bg-pattern z-0 pointer-events-none"></div>
    <div class="blob bg-braPurple top-[-10%] left-[-10%]"></div>
    <div class="blob bg-braCyan bottom-[-10%] right-[-10%]"></div>

    <div class="relative z-10 w-full max-w-md px-4">
        <div class="w-full bg-white/80 backdrop-blur-xl rounded-[3rem] shadow-2xl p-8 md:p-12 relative z-10 border border-white/50">
            
            <div class="flex flex-col items-center text-center mb-6">
                <a href="/" class="w-24 h-24 flex justify-center items-center group mb-4">
                    <img src="../../../../assets/images/logo-Brafurries/brafurries-sticker-low.avif" 
                        alt="Logo BraFurries" 
                        class="w-full h-full object-contain transition-all duration-500 ease-out group-hover:drop-shadow-[0_0_10px_#45bced90] group-hover:scale-105">
                </a>
                <h2 class="text-3xl font-amaranth font-bold text-braDark italic mb-2">Recuperar Senha</h2>
                <p class="text-gray-500 text-sm font-semibold uppercase tracking-widest" *ngIf="!isSuccess">Enviaremos um link para seu e-mail</p>
            </div>

            <div *ngIf="isSuccess" class="text-center">
                <div class="text-green-500 flex justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">E-mail enviado!</h3>
                <p class="text-gray-600 mb-6">Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.</p>
                <a routerLink="/login" class="inline-block w-full text-center text-white font-amaranth font-bold text-lg py-3 rounded-2xl shadow-xl transition-all duration-300 bg-braDark hover:bg-braPurple">
                    Voltar para Login
                </a>
            </div>

            <form *ngIf="!isSuccess" class="space-y-4" [formGroup]="forgotForm" (ngSubmit)="submit()">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-4">E-mail cadastrado</label>
                    <app-input-wrapper
                        class="input block w-full"
                        formControlName="email"
                        placeholder="seu@email.com"
                        [required]="true"
                    ></app-input-wrapper>
                </div>

                <p *ngIf="errorMessage" class="text-sm font-bold text-red-500 text-center">{{ errorMessage }}</p>

                <button type="submit" 
                    [disabled]="isSubmitting"
                    class="w-full text-white font-amaranth font-bold text-lg py-4 rounded-2xl shadow-xl transition-all duration-300 mt-4 flex items-center justify-center gap-3 relative overflow-hidden"
                    [ngClass]="isSubmitting ? 'bg-braPurple opacity-80 cursor-wait scale-[0.98]' : 'bg-braDark hover:bg-braPurple transform hover:scale-[1.02] active:scale-95'">
                    
                    <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>

                    <span>{{ isSubmitting ? 'Enviando...' : 'Enviar link de recuperação' }}</span>
                </button>
            </form>

            <p class="text-center mt-10 text-xs font-bold text-gray-400" *ngIf="!isSuccess">
                Lembrou a senha? 
                <a href="/login" class="text-braMagenta hover:underline">Voltar ao login</a>
            </p>
        </div>
    </div>
</div>
