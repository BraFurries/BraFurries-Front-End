# Keep default Gitleaks rules intact.
# Scoped exception for a known synthetic Discord snowflake in test fixtures.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test-only Discord snowflake, never a credential"
targetRules = ["discord-client-id"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^123456789012345678$''']
paths = [
  '''^src/app/core/services/admin\.service\.spec\.ts$''',
  '''^src/app/modules/dashboard/admin/pages/usuarios/perfil/perfil-usuario\.component\.spec\.ts$''',
  '''^src/app/modules/dashboard/servidores/partner-discord-panel\.component\.spec\.ts$''',
]
