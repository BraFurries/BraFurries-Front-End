# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

# Canonical public repository: BraFurries/BraFurries-Front-End.
# The old -Next name redirects to this repository, but github.repository uses
# the current name. Keep production disabled until an explicit second gate is
# configured by an authorized operator; never deploy from legacy forks.
'on':
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: firebase-production-hosting
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: ${{ github.repository == 'BraFurries/BraFurries-Front-End' && vars.FRONT_PROD_DEPLOY_APPROVED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.FRONT_AUTO_DEPLOY_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: npm ci, build
        run: |
          npm ci
          npm run build
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.30.2
          firebase --version
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAFURRIES }}
        run: |
          set -euo pipefail

          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "Missing Firebase service account secret."
            exit 1
          fi

          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"

          firebase deploy --only hosting --project brafurries --non-interactive
