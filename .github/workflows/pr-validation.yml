name: PR Validation

on:
  pull_request:
    branches:
      - main
      - feat/self-service-discord-account-recovery-20261105
      - feat/commerce-artwork-files-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan public history and tree with pinned Gitleaks
        run: |
          set -euo pipefail
          REPORT_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$REPORT_DIR"' EXIT

          set +e
          docker run --rm \
            --mount type=bind,source="$PWD",target=/repo,readonly \
            --mount type=bind,source="$REPORT_DIR",target=/reports \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --log-opts="--all" --redact=100 \
              --report-format json --report-path /reports/gitleaks.json
          SCAN_RC="$?"
          set -e

          if [[ "$SCAN_RC" -ne 0 && -f "$REPORT_DIR/gitleaks.json" ]]; then
            # Only print location and rule. Never print secret or matched text.
            python3 - "$REPORT_DIR/gitleaks.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as report:
              findings=json.load(report)
          for finding in findings:
              print("Gitleaks finding metadata:", {
                  "file": finding.get("File"),
                  "line": finding.get("StartLine"),
                  "rule": finding.get("RuleID"),
                  "commit": finding.get("Commit")
              })
          PY
          fi
          exit "$SCAN_RC"

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Community lifecycle tests
        run: >
          npm test -- --watch=false --browsers=ChromeHeadless
          --include=**/community-access.service.spec.ts
          --include=**/community-context.service.spec.ts
          --include=**/recrutamento.component.spec.ts
          --include=**/recruitment-reviewers.component.spec.ts
          --include=**/recruitment-stage-policy.component.spec.ts
          --include=**/recruitment-decision-desk.component.spec.ts
          --include=**/recruitment-vote-tally.component.spec.ts
          --include=**/recruitment-own-ballot.component.spec.ts
          --include=**/inscricoes.component.spec.ts
          --include=**/recruitment-candidate-exam.component.spec.ts
          --include=**/recruitment-exam-policy.component.spec.ts
          --include=**/recruitment-exam-review.component.spec.ts
          --include=**/triagem.component.spec.ts
          --include=**/community-context-layout.component.spec.ts
          --include=**/community-access.component.spec.ts
          --include=**/equipes.component.spec.ts
          --include=**/community-activity.service.spec.ts
          --include=**/community-activity.component.spec.ts
          --include=**/communities.component.spec.ts
          --include=**/membros.component.spec.ts
          --include=**/perfil-usuario.component.spec.ts
          --include=**/servidores.component.spec.ts
          --include=**/portaria-clarification-settings.component.spec.ts
          --include=**/temporary-roles-panel.component.spec.ts
          --include=**/xp-leveling-panel.component.spec.ts
          --include=**/managed-servers-xp.service.spec.ts
          --include=**/ai-configuration-panel.component.spec.ts
          --include=**/managed-servers-ai.service.spec.ts
          --include=**/vip-configuration-panel.component.spec.ts
          --include=**/backup-management-panel.component.spec.ts
          --include=**/theme-management-panel.component.spec.ts
          --include=**/commerce-access.component.spec.ts
          --include=**/commerce-catalog.component.spec.ts
          --include=**/commerce-finance.component.spec.ts
          --include=**/commerce-finance.service.spec.ts
          --include=**/commerce-catalog.service.spec.ts
          --include=**/commerce-access.service.spec.ts
          --include=**/base-layout-dashboard.component.spec.ts
          --include=**/stale-chunk-recovery.service.spec.ts
          --include=**/dashboard.guard.spec.ts
          --include=**/auth-token.interceptor.spec.ts
          --include=**/user.service.spec.ts
          --include=**/inicio.component.spec.ts
          --include=**/perfil.component.spec.ts
          --include=**/social-auth-error-message.spec.ts
          --include=**/login.component.spec.ts
          --include=**/social-register.component.spec.ts

      - name: Partner Markdown editor regression tests
        run: >
          npm test -- --watch=false --browsers=ChromeHeadless
          --include=**/partner-announcement-editor.component.spec.ts
          --include=**/editar-parceiro.component.spec.ts
          --include=**/partner-discord-panel.component.spec.ts

      - name: Partner announcement regression tests
        run: >
          npm test -- --watch=false --browsers=ChromeHeadless
          --include=**/parceiro-form.component.spec.ts
          --include=**/parceiros.component.spec.ts
          --include=**/editar-parceiro.component.spec.ts
